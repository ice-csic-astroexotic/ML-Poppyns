site_name: pypopsyn documentation
# Comment out the site_url for now as we cannot deploy this yet.
#site_url: https://mydomain.org/mysite
theme:
  # Load materials theme and adjust some colour settings.
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-6
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-5
        name: Switch to light mode
  features:
    # Add navigation buttons at the top.
    - navigation.tabs
    - content.code.copy
# Adding link to github repo.
repo_url: https://github.com/csic-ice-magnesia/MAGNESIA_population_synthesis
repo_name: MAGNESIA/population-synthesis
nav:
  # Overall navigation structure of the documentation.
  - Home: index.md
  - Basics:
      - basics/getting_started.md
      - basics/testing.md
      - basics/logging.md
      - basics/HTCondor.md
      - basics/dask.md
  - Tutorials:
      - tutorials/simulator_tutorial.md
      - tutorials/generator_tutorial.md
      - tutorials/learning_tutorial.md
      - tutorials/learning_tutorial_sbi.md
  - Code:
      - Simulator:
          - code/simulator/simulator.md
          - code/simulator/basics.md
          - code/simulator/stellar_dynamics.md
          - code/simulator/magneto_rotational_physics.md
          - code/simulator/interstellar_medium.md
          - code/simulator/multiband_emission.md
          - code/simulator/multiband_surveys.md
          - code/simulator/telemetry.md
      - Generator:
          - code/generator/generator.md
          - code/generator/maps.md
      - Learning:
          - code/learning/learning.md
          - code/learning/initializers.md
          - code/learning/layers.md
          - code/learning/loaders.md
          - code/learning/logger.md
          - code/learning/losses.md
          - code/learning/metrics.md
          - code/learning/models.md
          - code/learning/trainers.md
          - code/learning/utils.md
      - Utilities:
          - code/utilities/utilities.md
          - code/utilities/benchmark.md
          - code/utilities/experiment_helper.md
          - code/utilities/PIC_scripts.md
          - code/utilities/samplers.md
          - code/utilities/simulation_helper.md
plugins:
  # Adding plugin to autogenerate documentation.
  - mkdocstrings
  # Adding plugin to generate search bar.
  - search

markdown_extensions:
  # Extension for advanced code block formatting.
  - pymdownx.superfences
  # Extension for rendering of mathematical expressions.
  - pymdownx.arithmatex
  - mdx_math

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.5/MathJax.js?config=TeX-AMS_HTML
