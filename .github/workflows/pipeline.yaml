name: github action pipeline
on: push
jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          activate-environment: pop_syn_test
      - uses: actions/cache@v2
        with:
          path: ${{ env.CONDA }}/envs/pop_syn_test
          key: conda-${{ hashFiles('environment_test.yaml') }}
        id: cache
      - name: Install environment
        run: conda env create --file environment_test.yaml --force
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Always install pip dependencies
        run: conda env update -n pop_syn --file environment_test.yaml
#      - name: Install package in development mode
#        run: python setup.py develop
      - name: Run all tests
        run: pytest