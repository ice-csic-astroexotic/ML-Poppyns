name: pop_syn
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - astropy=5.3.1
  - black=23.7.0
  - corner=2.2.2
  - dask=2024.4.2
  - dask-jobqueue=0.8.5
  - f2c=20210323183018
  - ffmpeg=6.1.1
  - graphviz=8.1.0
  - healpy=1.16.2
  - jupyterlab=4.0.3
  - matplotlib=3.7.1
  - notebook=7.0.1
  - numba=0.59.0
  - numpy=1.24.4
  - orjson=3.9.2
  - pandas=2.0.3
  - pip=23.2.1
  - pre-commit=3.3.3
  - pyinstrument=4.5.1
  - pytest=7.4.0
  - pytest-cov=4.1.0
  - pytest-runner=6.0.0
  - python=3.11.4
  - pytorch=2.1.0
  - pytorch-cuda=12.1  # Comment this out if you are a macOS user.
  - scipy=1.11.1
  - sphinx=7.1.1
  - tensorboard=2.11.0
  - tensorboardx=2.6.2
  - termcolor=2.1.1
  - torchvision=0.16.0
  - pip:
      - pydeps
      - pygedm --global-option=build_ext --global-option="-I${CONDA_PREFIX}/include:/usr/local/include"
      - mkdocs-material
      - mkdocstrings-python